<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فريق شركة بن ختلان</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
color: #ffffff;
text-align: center;
padding: 40px 15px;
min-height: 100vh;
}
h1 {
font-size: 2.4rem;
margin-bottom: 15px;
color: #ffd700;
letter-spacing: 0.5px;
}

/* ===== صندوق الملاحظة الاحترافي ===== */
.note-box {
max-width: 780px;
margin: 0 auto 45px;
padding: 22px 28px;
background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
border: 1.5px solid rgba(255, 215, 0, 0.55);
border-right: 5px solid #ffd700;
border-radius: 14px;
text-align: right;
position: relative;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}
.note-box::before {
content: "★";
position: absolute;
top: -14px;
right: 22px;
background: #ffd700;
color: #0f2027;
width: 30px;
height: 30px;
line-height: 30px;
text-align: center;
border-radius: 50%;
font-size: 1rem;
box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}
.note-box p {
font-size: 1.1rem;
line-height: 1.9;
color: #fff8e1;
margin: 0;
}
.note-box p strong {
color: #ffd700;
font-size: 1.15rem;
}

/* ===== عناوين الأقسام ===== */
.section-title {
font-size: 1.6rem;
color: #ffd700;
margin: 45px auto 25px;
padding-bottom: 12px;
border-bottom: 2px solid rgba(255, 215, 0, 0.35);
max-width: 400px;
letter-spacing: 0.5px;
}

/* ===== شبكة الفريق ===== */
.team {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 20px;
max-width: 1150px;
margin: 0 auto;
}
.member {
background: rgba(255, 255, 255, 0.08);
border: 1px solid rgba(255, 215, 0, 0.25);
border-radius: 16px;
padding: 16px;
backdrop-filter: blur(6px);
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.member:hover {
transform: translateY(-6px);
box-shadow: 0 12px 28px rgba(255, 215, 0, 0.25);
}
.member img {
width: 100%;
height: 220px;
object-fit: cover;
border-radius: 12px;
border: 2px solid rgba(255, 215, 0, 0.4);
}
.role {
display: inline-block;
margin-top: 12px;
padding: 6px 18px;
background: rgba(255, 215, 0, 0.15);
color: #ffd700;
border: 1px solid rgba(255, 215, 0, 0.5);
border-radius: 20px;
font-size: 0.85rem;
font-weight: bold;
}
footer {
margin-top: 50px;
font-size: 0.9rem;
color: #90a4ae;
}
</style>
</head>
<body>

<h1>فريق شركة بن ختلان</h1>

<!-- ===== الملاحظة الاحترافية ===== -->
<div class="note-box">
<p>
<strong>ملاحظة:</strong>
لدينا عدد عمالة هائل لديه القدرة على تغطية أكبر المشاريع
بأعلى معايير الجودة والاحترافية.
</p>
</div>

<!-- قسم عمال التنظيف -->
<h2 class="section-title">🧹 عمال التنظيف</h2>
<div class="team">
<div class="member"><img src="clean-1.jpg" alt="عامل تنظيف 1"><span class="role">عمالة</span></div>
<div class="member"><img src="clean-2.jpg" alt="عامل تنظيف 2"><span class="role">عمالة</span></div>
<div class="member"><img src="clean-3.jpg" alt="عامل تنظيف 3"><span class="role">عمالة</span></div>
<div class="member"><img src="clean-4.jpg" alt="عامل تنظيف 4"><span class="role">عمالة</span></div>
<div class="member"><img src="clean-5.jpg" alt="عامل تنظيف 5"><span class="role">عمالة</span></div>
</div>

<!-- قسم عمال التشطيبات -->
<h2 class="section-title">🎨 عمال التشطيبات</h2>
<div class="team">
<div class="member"><img src="finish-1.jpg" alt="عامل تشطيب 1"><span class="role">عمالة</span></div>
<div class="member"><img src="finish-2.jpg" alt="عامل تشطيب 2"><span class="role">عمالة</span></div>
<div class="member"><img src="finish-3.jpg" alt="عامل تشطيب 3"><span class="role">عمالة</span></div>
<div class="member"><img src="finish-4.jpg" alt="عامل تشطيب 4"><span class="role">عمالة</span></div>
<div class="member"><img src="finish-5.jpg" alt="عامل تشطيب 5"><span class="role">عمالة</span></div>
</div>

<!-- قسم عمال الصيانة -->
<h2 class="section-title">🔧 عمال الصيانة</h2>
<div class="team">
<div class="member"><img src="maintain-1.jpg" alt="عامل صيانة 1"><span class="role">عمالة</span></div>
<div class="member"><img src="maintain-2.jpg" alt="عامل صيانة 2"><span class="role">عمالة</span></div>
<div class="member"><img src="maintain-3.jpg" alt="عامل صيانة 3"><span class="role">عمالة</span></div>
<div class="member"><img src="maintain-4.jpg" alt="عامل صيانة 4"><span class="role">عمالة</span></div>
<div class="member"><img src="maintain-5.jpg" alt="عامل صيانة 5"><span class="role">عمالة</span></div>
</div>

<footer>© شركة بن ختلان — جميع الحقوق محفوظة</footer>

</body>
</html>
